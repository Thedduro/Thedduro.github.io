  description: 데이터를 원본 보관 중심의 Bronze, 정제·검증 중심의 Silver, 업무 목적에 맞게 제공하는 Gold 계층으로 구성하는 설계 패턴이다. 계층별 데이터의 역할과 품질 기준을 구분하며, Gold는 집계나 업무별 데이터 모델 등으로 구현할 수 있다.
