- id: spark-cache
  title: Spark 캐시
  english: Spark Cache
  abbreviations: []
  term_aliases:
  - 스파크 캐시
  description: Apache Spark에서 RDD나 DataFrame의 계산 결과를 파티션 단위로 저장해 후속 작업에서 재사용하는 기능이다. cache()나 persist()로 저장을 지정하고, 액션이 필요한 파티션을 계산할 때 결과를 저장한다. 저장 위치는 대상 API와 저장 수준에 따라 메모리 또는 디스크 등이 될 수 있다.
