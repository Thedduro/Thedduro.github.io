locale = 'ko-kr'
defaultContentLanguage = 'ko'
hasCJKLanguage = true
timeZone = 'Asia/Seoul'
enableRobotsTXT = true
summaryLength = 30

[permalinks]
  posts = '/posts/:slug/'

[taxonomies]
