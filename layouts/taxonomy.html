{{ define "main" }}
  <div class="container page-shell">
    <header class="page-header">
      <p class="eyebrow">Topics</p>
      <h1>{{ .Title }}</h1>
      <p>관심 있는 주제의 글을 모아볼 수 있습니다.</p>
    </header>
    <div class="term-cloud">
      {{ range .Data.Terms.ByCount }}
        <a href="{{ .Page.RelPermalink }}"><span>#{{ .Page.LinkTitle }}</span><small>{{ .Count }}</small></a>
      {{ else }}
        <p>아직 등록된 항목이 없습니다.</p>
      {{ end }}
    </div>
  </div>
{{ end }}
