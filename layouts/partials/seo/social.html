{{- $page := .page -}}
{{- $seo := .seo -}}
<meta property="og:title" content="{{ $seo.title }}">
<meta property="og:description" content="{{ $seo.description }}">
<meta property="og:url" content="{{ $page.Permalink }}">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:locale" content="{{ site.Language.Locale | replaceRE `-` `_` }}">
<meta property="og:type" content="{{ cond $seo.isPost "article" "website" }}">
<meta name="twitter:card" content="{{ cond (ne $seo.image "") "summary_large_image" "summary" }}">
<meta name="twitter:title" content="{{ $seo.title }}">
<meta name="twitter:description" content="{{ $seo.description }}">
{{ with $seo.image }}
<meta property="og:image" content="{{ . }}">
<meta name="twitter:image" content="{{ . }}">
{{ with $page.Params.imageAlt }}
<meta property="og:image:alt" content="{{ . }}">
<meta name="twitter:image:alt" content="{{ . }}">
{{ end }}
{{ end }}
{{ if $seo.isPost }}
<meta property="article:published_time" content="{{ $page.PublishDate.Format "2006-01-02T15:04:05Z07:00" }}">
<meta property="article:modified_time" content="{{ $page.Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">
{{ with site.GetPage "/about" }}<meta property="article:author" content="{{ .Permalink }}">{{ end }}
{{ end }}
