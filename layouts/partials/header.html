<header class="site-header">
  <div class="header-inner container">
    <a class="site-logo" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }} 홈">
      <span class="logo-mark">T</span>
      <span>{{ site.Title }}</span>
    </a>

    <div class="header-actions">
      <nav class="site-nav" aria-label="주요 메뉴">
        {{ range site.Menus.main }}
          <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a>
        {{ end }}
      </nav>
      <button class="theme-toggle" type="button" aria-label="다크 모드로 전환" title="색상 모드 전환">
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      </button>
    </div>
  </div>
</header>
