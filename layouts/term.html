{{ define "main" }}
  <div class="container page-shell">
    <header class="page-header">
      <p class="eyebrow">Topic</p>
      <h1>#{{ .Title }}</h1>
      <p>이 주제와 관련된 글 {{ len .Pages }}개입니다.</p>
    </header>
    {{ if .Pages }}
      <div class="post-list">
        {{ range .Pages.ByDate.Reverse }}{{ partial "post-card.html" . }}{{ end }}
      </div>
    {{ else }}
      <div class="empty-state"><p>아직 표시할 글이 없습니다.</p></div>
    {{ end }}
  </div>
{{ end }}
