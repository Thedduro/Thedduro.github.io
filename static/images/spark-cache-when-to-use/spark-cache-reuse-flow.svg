<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc">
  <title id="title">Spark cache의 첫 계산과 재사용</title>
  <desc id="desc">캐시를 사용하지 않으면 건수 계산과 평균 집계에서 원본 읽기와 전처리가 반복될 수 있다. 캐시를 사용하면 첫 액션에서 전처리 결과를 저장하고, 두 번째 액션은 남아 있는 캐시를 읽어 평균을 계산한다. 결과가 아닌 공통 입력을 재사용하는 도식이다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8" fill="none" stroke="#506078" stroke-width="2"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #1b2b40; }
      .heading { font-size: 28px; font-weight: 700; }
      .label { font-size: 25px; font-weight: 600; text-anchor: middle; }
      .small { font-size: 22px; fill: #485a72; }
      .flow { fill: none; stroke: #506078; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="720" height="760" rx="20" fill="#f5f7fb"/>
  <rect x="20" y="20" width="680" height="306" rx="14" fill="#fff" stroke="#d9e1ec"/>
  <text x="44" y="66" class="heading">캐시 없음</text>
  <text x="44" y="100" class="small">두 액션에서 공통 계산이 반복될 수 있다</text>
  <rect x="44" y="124" width="260" height="76" rx="10" fill="#edf1f7"/>
  <text x="174" y="155" class="label">원본 읽기</text>
  <text x="174" y="184" class="label">공통 전처리</text>
  <path d="M304 162 H441" class="flow"/>
  <rect x="452" y="124" width="224" height="76" rx="10" fill="#fff" stroke="#a8b5c7"/>
  <text x="564" y="171" class="label">① 건수 계산</text>
  <rect x="44" y="222" width="260" height="76" rx="10" fill="#edf1f7"/>
  <text x="174" y="253" class="label">원본 읽기</text>
  <text x="174" y="282" class="label">공통 전처리</text>
  <path d="M304 260 H441" class="flow"/>
  <rect x="452" y="222" width="224" height="76" rx="10" fill="#fff" stroke="#a8b5c7"/>
  <text x="564" y="269" class="label">② 평균 집계</text>
  <rect x="20" y="346" width="680" height="330" rx="14" fill="#fff" stroke="#d9e1ec"/>
  <text x="44" y="392" class="heading">공통 전처리 결과를 캐시</text>
  <text x="44" y="426" class="small">첫 액션에서 저장하고, 다음 액션에서 읽는다</text>
  <rect x="44" y="456" width="194" height="88" rx="10" fill="#edf1f7"/>
  <text x="141" y="492" class="label">원본 읽기</text>
  <text x="141" y="523" class="label">공통 전처리</text>
  <path d="M238 500 H285" class="flow"/>
  <rect x="296" y="456" width="142" height="88" rx="10" fill="#e1f2ea" stroke="#398464" stroke-width="2"/>
  <text x="367" y="492" class="label">캐시</text>
  <text x="367" y="522" text-anchor="middle" class="small">결과 저장</text>
  <path d="M438 500 H487" class="flow"/>
  <rect x="498" y="456" width="178" height="88" rx="10" fill="#fff" stroke="#a8b5c7"/>
  <text x="587" y="508" class="label">① 건수 계산</text>
  <path d="M367 544 V608 H487" class="flow"/>
  <text x="44" y="603" class="small">남아 있는 캐시를</text>
  <text x="44" y="633" class="small">다음 작업이 재사용</text>
  <rect x="498" y="568" width="178" height="80" rx="10" fill="#fff" stroke="#a8b5c7"/>
  <text x="587" y="617" class="label">② 평균 집계</text>
  <text x="36" y="711" class="small">캐시 블록이 유지된 경우의 흐름을 단순화한 도식.</text>
  <text x="36" y="743" class="small">평균 집계 자체는 두 번째 액션에서 실행된다.</text>
</svg>
