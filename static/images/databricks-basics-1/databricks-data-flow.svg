<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1080" viewBox="0 0 760 1080" role="img" aria-labelledby="title desc">
<title id="title">Databricks에서 데이터와 작업이 연결되는 방식</title>
<desc id="desc">클라우드 원천 파일을 Notebook에서 작성한 Spark 작업이 compute에서 처리하고 Delta 테이블로 저장한다. 같은 테이블에서 SQL 분석과 AI·모델 작업으로 갈라진다. Lakeflow Jobs는 실행 순서와 이력을, Unity Catalog는 접근 권한과 계보를 관리한다. Genie는 코드 작성과 자연어 데이터 질문을 돕는다.</desc>
